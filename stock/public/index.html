<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sistema de Stock</title>
  <link rel="stylesheet" href="/css/estilos.css" />
</head>
<body>
  <div id="login" class="login oculto">
    <form id="login-form" class="login-caja">
      <h1>Sistema de Stock</h1>
      <label><span>Usuario</span><input name="usuario" autocomplete="username" autofocus required /></label>
      <label><span>Contraseña</span><input name="password" type="password" autocomplete="current-password" required /></label>
      <p id="login-error" class="error"></p>
      <button class="primario" type="submit">Entrar</button>
    </form>
  </div>

  <div id="app" class="app oculto">
    <aside class="menu">
      <div class="marca"><strong id="negocio">Sistema de Stock</strong></div>
      <nav id="nav"></nav>
      <div class="menu-pie">
        <span id="usuario-nombre"></span>
        <button id="salir" class="secundario">Salir</button>
      </div>
    </aside>
    <main id="contenido"></main>
  </div>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
